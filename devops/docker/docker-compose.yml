version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: saiap
      POSTGRES_PASSWORD: saiap_dev_password
      POSTGRES_DB: saiap
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../backend
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../../backend:/app

  frontend:
    build:
      context: ../../frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app

volumes:
  db_data:
